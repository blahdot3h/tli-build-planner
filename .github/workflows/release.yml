# The downloadable overlay: on a version tag (v0.2.0) build the Windows portable exe and installer
# with electron-builder and attach them to a GitHub Release. The site's "Download" button points at
# releases/latest.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          TLI_CLOUD_URL: ${{ vars.MARKET_API_URL }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
          generate_release_notes: true
